name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the jobs below this change needs. A job skipped by its
  # `if` reports as passed, so required checks still go green.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.node.outputs.node }}
      rust: ${{ steps.rust.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      # Everything except Rust sources and docs. The SRP test vectors under
      # crates/ are shared with the API tests, so only .rs files are left out.
      - uses: dorny/paths-filter@v3
        id: node
        with:
          predicate-quantifier: every
          filters: |
            node:
              - '**'
              - '!**/*.rs'
              - '!**/Cargo.toml'
              - '!Cargo.lock'
              - '!**/*.md'
              - '!docs/**'
      - uses: dorny/paths-filter@v3
        id: rust
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

  node:
    name: TypeScript (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Synthesize AWS infrastructure (no deploy)
        run: pnpm --filter @zvault/infra synth

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    name: macOS desktop (clippy, test)
    # macOS minutes count 10x against the private-repo allowance, so this runs
    # only on pull requests that touch Rust, and only after the Linux Rust job
    # passes. Merges to main were already checked here on their PR.
    needs: [changes, rust]
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p zvault-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p zvault-desktop --locked
