name: E2E (Mac app, nightly)

# Drives the real Mac app (Tauri) through tauri-driver + WebdriverIO. The app is
# built for Linux (WebKitGTK), so this costs no macOS minutes. It runs once a
# night and on demand, not on every pull request: the build takes a while.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-desktop
  cancel-in-progress: true

jobs:
  desktop:
    name: WebdriverIO (Mac app on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zvault
          POSTGRES_PASSWORD: zvault
          POSTGRES_DB: zvault
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zvault" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://zvault:zvault@localhost:5432/zvault
      DATABASE_SSL: 'false'
      MAIL_TRANSPORT: log
      PORT: '3000'
      CORS_ORIGINS: tauri://localhost,http://tauri.localhost
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zvault/shared build
      - name: Build the app (debug, frontend embedded, no bundle)
        run: pnpm --filter @zvault/desktop exec tauri build --debug --no-bundle
      - name: Start the API
        run: |
          export SERVER_SECRET="$(openssl rand -base64 48)"
          pnpm --filter @zvault/api db:migrate
          nohup pnpm --filter @zvault/api exec node --import @swc-node/register/esm-register src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:3000/v1/health && break; sleep 1; done
      - name: Run the Mac app tests
        env:
          ZVAULT_API_LOG: ${{ runner.temp }}/api.log
        run: xvfb-run -a pnpm --filter @zvault/e2e test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e
          path: |
            e2e/test-results
            ${{ runner.temp }}/api.log
          retention-days: 14
