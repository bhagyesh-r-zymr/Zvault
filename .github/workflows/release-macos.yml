name: Release macOS app

# Builds a universal (Apple silicon + Intel) Zvault.dmg.
#   - Push a tag like v0.1.0, or run it from the Actions tab with a release tag,
#     to build it and publish it on a GitHub Release (with zv next to it).
#   - Run it by hand without a tag and the .dmg is only a workflow artifact.
#
# The app talks to the ZVAULT_API_URL repository variable. Until that is set it
# uses the demo server below, which also hosts the share-link page.
#
# Signing and notarization turn on when the APPLE_* secrets are set (see
# docs/macos-release.md). Without them the .dmg is unsigned: it installs, but
# macOS warns on first open and Touch ID unlock is unavailable.
#
# Auto-update turns on when the TAURI_SIGNING_PRIVATE_KEY secret (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and the TAURI_UPDATER_PUBKEY variable are
# set (see docs/auto-update.md). The release then carries a signed
# Zvault.app.tar.gz and latest.json, which installed apps check, and a signed
# zv-macos-universal.sig for `zv update`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this new tag, e.g. v0.1.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build Zvault.dmg
    runs-on: macos-latest
    env:
      # Where the shipped app talks to. Set these as repository variables to
      # move off the demo server.
      VITE_API_URL: ${{ vars.ZVAULT_API_URL || 'https://52-66-189-120.sslip.io' }}
      VITE_SHARE_ORIGIN: ${{ vars.ZVAULT_SHARE_ORIGIN || vars.ZVAULT_API_URL || 'https://52-66-189-120.sslip.io' }}
      # Printed on the Emergency Kit as the address to sign in at.
      ZVAULT_SIGN_IN_URL: ${{ vars.ZVAULT_SIGN_IN_URL || vars.ZVAULT_API_URL || 'https://52-66-189-120.sslip.io' }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zvault/shared build

      - name: Check the release tag
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v0.1.0, got '$RELEASE_TAG'."
            exit 1
          fi

      # The updater's signing key. Only exported when both halves exist: the
      # app must not ship a public key whose releases nobody can sign.
      - name: Load updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
              echo "UPDATER_PUBKEY=$UPDATER_PUBKEY"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret or TAURI_UPDATER_PUBKEY variable: this build will not update itself."
          fi

      # Release-only config: version from the tag, the API origin added to
      # the CSP so the app may reach it, and the updater key when there is one.
      - name: Write release config
        working-directory: apps/desktop
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="0.0.0"
          fi
          csp=$(jq -r '.app.security.csp' src-tauri/tauri.conf.json)
          if [ -n "$VITE_API_URL" ]; then
            origin=$(node -e 'console.log(new URL(process.argv[1]).origin)' "$VITE_API_URL")
            csp="${csp/connect-src /connect-src $origin }"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          jq -n --arg v "$version" --arg csp "$csp" --arg key "${UPDATER_PUBKEY:-}" \
            '{version: $v, app: {security: {csp: $csp}}, bundle: {externalBin: ["binaries/zv"]}}
             + if $key == "" then {} else {
                 bundle: {externalBin: ["binaries/zv"], createUpdaterArtifacts: true},
                 plugins: {updater: {pubkey: $key}}
               } end' \
            > src-tauri/tauri.release.conf.json
          cat src-tauri/tauri.release.conf.json

      # The zv command-line tool ships inside Zvault.app (Contents/MacOS/zv)
      # as a Tauri sidecar; the app's "Install command-line tool" links it
      # onto the PATH. Tauri wants it named for the target triple.
      # zv reports the release version and checks `zv update` downloads
      # against the updater key.
      - name: Build zv
        env:
          ZV_VERSION: ${{ env.VERSION }}
          ZVAULT_UPDATER_PUBKEY: ${{ env.UPDATER_PUBKEY }}
        run: |
          cargo build -p zvault-cli --release --locked --target aarch64-apple-darwin
          cargo build -p zvault-cli --release --locked --target x86_64-apple-darwin
          mkdir -p apps/desktop/src-tauri/binaries
          # A universal build compiles the app once per architecture, and each
          # pass looks for the sidecar under its own triple.
          cp target/aarch64-apple-darwin/release/zv apps/desktop/src-tauri/binaries/zv-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/zv apps/desktop/src-tauri/binaries/zv-x86_64-apple-darwin
          lipo -create -output apps/desktop/src-tauri/binaries/zv-universal-apple-darwin \
            target/aarch64-apple-darwin/release/zv target/x86_64-apple-darwin/release/zv
          lipo -info apps/desktop/src-tauri/binaries/zv-universal-apple-darwin

      # Only export the signing secrets that exist: Tauri treats an empty
      # APPLE_CERTIFICATE as "sign with this" and fails.
      - name: Load signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret: building an unsigned .dmg."
          fi

      # Signs with the Developer ID certificate and notarizes with the Apple ID
      # when the variables above are set.
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          # Creates the tag on this commit when it doesn't exist yet.
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Zvault ${{ env.RELEASE_TAG }}
          releaseBody: |
            Zvault for macOS (Apple silicon and Intel). Download the .dmg below, open it and drag Zvault to Applications.
            This build is not notarized yet: the first time, right-click Zvault in Applications and choose Open.
            The app connects to ${{ env.VITE_API_URL }}. The `zv` command-line tool is inside the app (Settings > Command line) and attached here on its own.
            Once installed, Zvault offers new versions itself when it starts (or Settings > Account > Check for updates), and a standalone `zv` updates with `zv update`.
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: Zvault-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # zv on its own, for machines that only need the CLI next to an
      # installed Zvault. Signed copies are the ones inside the .dmg.
      - uses: actions/upload-artifact@v4
        with:
          name: zv-macOS
          path: apps/desktop/src-tauri/binaries/zv-universal-apple-darwin
          if-no-files-found: error

      - name: Attach zv to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apps/desktop/src-tauri/binaries/zv-universal-apple-darwin zv-macos-universal
          files=(zv-macos-universal)
          # `zv update` checks that the signature names this version's file,
          # so sign a copy under that name and ship the signature beside zv.
          if [ -n "${UPDATER_PUBKEY:-}" ]; then
            signed="zv-${RELEASE_TAG}-macos-universal"
            cp zv-macos-universal "$signed"
            pnpm --filter @zvault/desktop exec tauri signer sign "$PWD/$signed"
            mv "$signed.sig" zv-macos-universal.sig
            files+=(zv-macos-universal.sig)
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
