[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Stripped proc-macro dylibs fail to load on macOS 27 ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
