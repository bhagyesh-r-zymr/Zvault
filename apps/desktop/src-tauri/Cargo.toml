[package]
name = "zvault-desktop"
version = "0.0.0"
description = "Zvault macOS app"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "zvault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rqrr = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
nix = { version = "0.30", default-features = false, features = ["process", "socket", "user"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }
zvault-agent = { path = "../../../crates/zvault-agent" }
zvault-crypto = { path = "../../../crates/zvault-crypto" }
zvault-emergency-kit = { path = "../../../crates/zvault-emergency-kit" }
zvault-otp = { path = "../../../crates/zvault-otp" }
zvault-passkeys = { path = "../../../crates/zvault-passkeys" }
zvault-passwords = { path = "../../../crates/zvault-passwords" }
tauri-plugin-updater = "2"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }

# Same as the workspace lints except `unsafe_code`, which is `deny` rather than
# `forbid` so that `src/platform/macos` alone can call Apple APIs. Nothing else
# in this crate may use `unsafe`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSDistributedNotificationCenter",
  "NSError",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
