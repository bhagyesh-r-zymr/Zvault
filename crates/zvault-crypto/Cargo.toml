[package]
name = "zvault-crypto"
version = "0.0.0"
description = "Zvault client-side cryptography: key derivation, Secret Keys and AEAD. Runs only on the user's device."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
num-bigint = "0.5"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
