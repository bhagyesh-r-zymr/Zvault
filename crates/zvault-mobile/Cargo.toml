[package]
name = "zvault-mobile"
version = "0.0.0"
description = "Zvault's crypto core for the phone app, called from Flutter through flutter_rust_bridge. Keys stay in Rust."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# Cargokit and the Flutter plugin load the library by this name.
name = "rust_lib_zvault_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
flutter_rust_bridge = "=2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"
zeroize = { version = "1.8", features = ["derive"] }
zvault-crypto = { path = "../zvault-crypto" }
zvault-otp = { path = "../zvault-otp" }

# Not the workspace lints: the generated bridge needs unsafe FFI code, so
# unsafe is denied (and allowed only on that one module) rather than forbidden.
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
