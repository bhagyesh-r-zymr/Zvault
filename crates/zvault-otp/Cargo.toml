[package]
name = "zvault-otp"
version = "0.0.0"
description = "One-time passwords stored in vault items: otpauth:// parsing and RFC 6238 TOTP codes. Runs only on the user's device."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[lints]
workspace = true
