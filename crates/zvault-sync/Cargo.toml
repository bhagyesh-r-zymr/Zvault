[package]
name = "zvault-sync"
version = "0.0.0"
description = "Pushes project secrets from the user's device to GitHub Actions and AWS Secrets Manager. Values are decrypted on the device and go straight to the provider; the Zvault server never sees them."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# The ring provider the desktop app already uses (via the updater).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
