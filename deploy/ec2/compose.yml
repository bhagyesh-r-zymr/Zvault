# Zvault demo on a single EC2 host. Host nginx terminates TLS and proxies to the
# ports below, which listen on 127.0.0.1 only. See deploy/ec2/README.md.
# Secrets come from .env next to this file (never committed).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: zvault
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'zvault']
      interval: 5s
      retries: 10

  # Catches every outgoing email; the inbox is served at /mail behind a password.
  # STARTTLS with a self-signed cert because the API refuses plaintext SMTP in production.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_WEBROOT: mail
      MP_UI_AUTH: ${MAIL_UI_AUTH:?}
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_MAX_MESSAGES: 1000
    volumes: ['./certs:/certs:ro']
    ports: ['127.0.0.1:8025:8025']

  migrate:
    image: zvault-api:demo
    command: ['dist/db/migrate.js']
    env_file: .env
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://zvault:${POSTGRES_PASSWORD}@postgres:5432/zvault
      DATABASE_SSL: 'false'
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NODE_EXTRA_CA_CERTS: /certs/mailpit.crt
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: zvault-api:demo
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      PORT: 3000
      TRUST_PROXY_HOPS: 1
    volumes: ['./certs/mailpit.crt:/certs/mailpit.crt:ro']
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  pgdata:
