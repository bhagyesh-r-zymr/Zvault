# Zvault demo on a single EC2 host. Host nginx terminates TLS and proxies to the
# ports below, which listen on 127.0.0.1 only. See deploy/ec2/README.md.
# Secrets come from .env next to this file (never committed).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: zvault
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'zvault']
      interval: 5s
      retries: 10

  migrate:
    image: zvault-api:demo
    command: ['dist/db/migrate.js']
    env_file: .env
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://zvault:${POSTGRES_PASSWORD}@postgres:5432/zvault
      DATABASE_SSL: 'false'
      # Amazon SES over SMTP (STARTTLS). Credentials come from .env; see README.
      MAIL_TRANSPORT: smtp
      SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
      SMTP_PORT: 587
      SMTP_USER: ${SES_SMTP_USER:?}
      SMTP_PASS: ${SES_SMTP_PASS:?}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: zvault-api:demo
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      PORT: 3000
      TRUST_PROXY_HOPS: 1
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
