# Host nginx site for the Zvault demo. HOST is replaced by setup.sh
# (e.g. 52-66-189-120.sslip.io, which resolves to the box's IP; no domain needed).
server {
    listen 80;
    listen [::]:80;
    server_name HOST;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name HOST;

    ssl_certificate     /etc/letsencrypt/live/HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # API
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Mailpit inbox (password protected by Mailpit itself)
    location /mail/ {
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Share-link recipient page (static build of apps/share-web)
    location / {
        root /usr/share/nginx/zvault-share;
        try_files $uri /index.html;
    }
}
