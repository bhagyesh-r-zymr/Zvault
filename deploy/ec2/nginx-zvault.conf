# Host nginx site for the Zvault demo. HOST is replaced by setup.sh
# (e.g. 52-66-189-120.sslip.io, which resolves to the box's IP; no domain needed).
server {
    listen 80;
    listen [::]:80;
    server_name HOST;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name HOST;

    ssl_certificate     /etc/letsencrypt/live/HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # API
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static site in /usr/share/nginx/zvault-share (the folder name predates the
    # landing page): apps/site at the root, the apps/share-web build under /share/.
    root /usr/share/nginx/zvault-share;

    # Share-link recipient page
    location /share/ {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri /share/index.html;
    }

    # Landing page. Compress text assets: the 3D hero ships three.js (~690 KB raw).
    location / {
        gzip on;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }
}
